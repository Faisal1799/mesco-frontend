// USER MANAGEMENT PAGE
// ═══════════════════════════════════════════════════════════════════
function UserManagementPage({currentUser}) {
  const [users, setUsers] = useState([]);
  const [showForm, setShowForm] = useState(false);
  const [editingUser, setEditingUser] = useState(null);
  const [search, setSearch] = useState('');
  const [filterRole, setFilterRole] = useState('all');
  const [showPass, setShowPass] = useState(false);
  const [error, setError] = useState('');
  const [success, setSuccess] = useState('');
  const [loading, setLoading] = useState(true);
  const emptyForm = {name:'',email:'',password:'',role:'employee',department:'',employeeId:'',hodId:'',isActive:true,joinDate:new Date().toISOString().split('T')[0]};
  const [form, setForm] = useState(emptyForm);

  const refresh = async () => {
    try {
      const data = await api.getUsers();
      if(data.success) setUsers(data.users);
    } catch(e) {}
    setLoading(false);
  };

  useEffect(()=>{ refresh(); },[]);

  const hods = users.filter(u=>u.role==='hod');
  const departments = [...new Set(users.map(u=>u.department))];
  const filtered = users.filter(u=>{
    const ms=u.name.toLowerCase().includes(search.toLowerCase())||u.email.toLowerCase().includes(search.toLowerCase())||(u.employeeId||'').toLowerCase().includes(search.toLowerCase());
    return ms&&(filterRole==='all'||u.role===filterRole);
  });

  const handleSubmit = async e => {
    e.preventDefault(); setError('');
    if(!form.name||!form.email||!form.department||!form.employeeId){setError('Please fill all required fields.');return;}
    if(!editingUser&&!form.password){setError('Password is required for new users.');return;}
    try {
      if(editingUser){
        const updates={name:form.name,email:form.email,role:form.role,department:form.department,employeeId:form.employeeId,hodId:form.hodId||undefined,isActive:form.isActive,joinDate:form.joinDate};
        if(form.password) updates.password=form.password;
        await api.updateUser(editingUser.id, updates);
        setSuccess('User updated successfully.');
      } else {
        await api.createUser({name:form.name,email:form.email,password:form.password,role:form.role,department:form.department,employeeId:form.employeeId,hodId:form.hodId||undefined,isActive:true,joinDate:form.joinDate});
        setSuccess('User added successfully.');
      }
      setShowForm(false); setEditingUser(null); setForm(emptyForm); refresh();
    } catch(err) {
      setError(err.message||'Something went wrong. Please try again.');
    }
  };

  const startEdit = u => { setEditingUser(u); setForm({...u,password:'',hodId:u.hodId||''}); setShowForm(true); setError(''); };
  const toggleActive = async u => { try { await api.updateUser(u.id,{name:u.name,email:u.email,role:u.role,department:u.department,employeeId:u.employeeId,isActive:!u.isActive,joinDate:u.joinDate}); refresh(); } catch(e){} };
  const RBADGE = {admin:'badge badge-admin',hod:'badge badge-hod',employee:'badge badge-employee'};

  return h('div',{className:'space-y'},
    loading && h('div',{className:'alert alert-yellow'},'Loading users...'),
    success && h('div',{className:'alert alert-green'},success),
    h('div',{className:'flex flex-wrap items-center gap-3'},
      h('div',{className:'section-header',style:{margin:0}},Icons.users(),h('span',{className:'section-title'},'User Management')),
      h('div',{className:'flex gap-2',style:{marginLeft:'auto'}},
        h('input',{value:search,onChange:e=>setSearch(e.target.value),placeholder:'Search users...',className:'input',style:{width:160}}),
        h('select',{value:filterRole,onChange:e=>setFilterRole(e.target.value),className:'input',style:{width:'auto'}},
          h('option',{value:'all'},'All Roles'),h('option',{value:'admin'},'Admin'),h('option',{value:'hod'},'HOD'),h('option',{value:'employee'},'Employee')),
        h('button',{className:'btn btn-yellow btn-sm',onClick:()=>{setShowForm(!showForm);setEditingUser(null);setForm(emptyForm);setError('');}},
          Icons.plus(),' Add User'))),
    showForm && h('div',{className:'card-yellow'},
      h('div',{style:{color:'#fff',fontWeight:700,marginBottom:16}},editingUser?'Edit User':'Add New User'),
      h('form',{onSubmit:handleSubmit},
        h('div',{className:'grid-2',style:{gap:12,marginBottom:12}},
          [{label:'Full Name *',key:'name',type:'text',placeholder:'Full name'},{label:'Email *',key:'email',type:'email',placeholder:'email@mesco.org'},{label:'Employee ID *',key:'employeeId',type:'text',placeholder:'MESCO-XXX'},{label:'Join Date',key:'joinDate',type:'date',placeholder:''}].map(f=>
            h('div',{key:f.key,className:'input-group'},
              h('label',{className:'label'},f.label),
              h('input',{type:f.type,className:'input',value:form[f.key],onChange:e=>setForm(p=>({...p,[f.key]:e.target.value})),placeholder:f.placeholder}))),
          h('div',{className:'input-group'},
            h('label',{className:'label'},editingUser?'Password (leave blank to keep)':'Password *'),
            h('div',{style:{position:'relative'}},
              h('input',{type:showPass?'text':'password',className:'input',value:form.password,onChange:e=>setForm(p=>({...p,password:e.target.value})),placeholder:'Password',style:{paddingRight:40}}),
              h('button',{type:'button',className:'btn-icon',style:{position:'absolute',right:8,top:'50%',transform:'translateY(-50%)'},onClick:()=>setShowPass(!showPass)},showPass?Icons.eyeoff():Icons.eye()))),
          h('div',{className:'input-group'},
            h('label',{className:'label'},'Role *'),
            h('select',{className:'input',value:form.role,onChange:e=>setForm(p=>({...p,role:e.target.value}))},
              h('option',{value:'employee'},'Employee'),h('option',{value:'hod'},'HOD'),h('option',{value:'admin'},'Admin'))),
          h('div',{className:'input-group'},
            h('label',{className:'label'},'Department *'),
            h('input',{list:'dept-list',className:'input',value:form.department,onChange:e=>setForm(p=>({...p,department:e.target.value})),placeholder:'Department'}),
            h('datalist',{id:'dept-list'},departments.map(d=>h('option',{key:d,value:d})))),
          form.role==='employee' && h('div',{className:'input-group'},
            h('label',{className:'label'},'Reports to (HOD)'),
            h('select',{className:'input',value:form.hodId,onChange:e=>setForm(p=>({...p,hodId:e.target.value}))},
              h('option',{value:''},'Select HOD'),
              hods.map(hod=>h('option',{key:hod.id,value:hod.id},`${hod.name} (${hod.department})`))))),
        error && h('div',{className:'alert alert-red',style:{marginBottom:12}},error),
        h('div',{className:'flex gap-3'},
          h('button',{type:'submit',className:'btn btn-yellow flex-1',style:{justifyContent:'center'}},editingUser?'Update User':'Add User'),
          h('button',{type:'button',className:'btn btn-ghost',onClick:()=>{setShowForm(false);setEditingUser(null);setError('');}}, 'Cancel')))),
    h('div',{className:'card',style:{padding:0,overflow:'hidden'}},
      h('div',{style:{padding:'12px 16px',borderBottom:'1px solid #1f2937',color:'#9ca3af',fontSize:13}},`${filtered.length} user${filtered.length!==1?'s':''} found`),
      h('div',{className:'table-wrap'},
        h('table',null,
          h('thead',null,h('tr',null,['Employee','ID','Department','Role','Join Date','Status','Actions'].map(hdr=>h('th',{key:hdr},hdr)))),
          h('tbody',null,
            filtered.map(u=>h('tr',{key:u.id,style:{opacity:u.isActive?1:0.5}},
              h('td',null,
                h('div',{className:'flex items-center gap-2'},
                  h('div',{className:'avatar avatar-sm'},u.name.charAt(0)),
                  h('div',null,
                    h('div',{style:{color:'#fff',fontSize:13,fontWeight:500}},u.name),
                    h('div',{style:{color:'#6b7280',fontSize:11}},u.email)))),
              h('td',{style:{color:'#9ca3af',fontFamily:'monospace'}},u.employeeId),
              h('td',{style:{color:'#9ca3af'}},u.department),
              h('td',null,h('span',{className:RBADGE[u.role]||'badge badge-gray'},u.role)),
              h('td',{style:{color:'#9ca3af'}},u.joinDate),
              h('td',null,h('span',{className:u.isActive?'badge badge-green':'badge badge-gray'},u.isActive?'Active':'Inactive')),
              h('td',null,u.id!==currentUser.id && h('div',{className:'flex gap-1'},
                h('button',{className:'btn-icon',onClick:()=>startEdit(u),title:'Edit'},Icons.edit()),
                h('button',{className:'btn-icon',style:{color:u.isActive?'#6b7280':'#6b7280'},onClick:()=>toggleActive(u),title:u.isActive?'Deactivate':'Activate'},
                  u.isActive?Icons.userx():Icons.usercheck()))))))))));
}

// HOLIDAY PAGE
// ═══════════════════════════════════════════════════════════════════
function HolidayPage() {
  const [holidays, setHolidays] = useState(()=>store.getHolidays());
  const [showForm, setShowForm] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [form, setForm] = useState({date:'',name:'',isIslamic:false});
  const [error, setError] = useState('');
  const refresh = () => setHolidays(store.getHolidays());

  const handleSubmit = e => {
    e.preventDefault(); setError('');
    if(!form.date||!form.name){setError('Date and name are required.');return;}
    if(editingId){store.updateHoliday(editingId,{date:form.date,name:form.name,isIslamic:form.isIslamic});}
    else{if(holidays.find(h=>h.date===form.date)){setError('A holiday already exists on this date.');return;}store.addHoliday({date:form.date,name:form.name,isIslamic:form.isIslamic,isEditable:true});}
    setForm({date:'',name:'',isIslamic:false}); setShowForm(false); setEditingId(null); refresh();
  };

  const startEdit = h => { setEditingId(h.id); setForm({date:h.date,name:h.name,isIslamic:h.isIslamic}); setShowForm(true); setError(''); };
  const handleDelete = id => { if(confirm('Remove this holiday?')){store.deleteHoliday(id);refresh();} };
  const sortedHols = [...holidays].sort((a,b)=>a.date.localeCompare(b.date));
  const grouped = {};
  sortedHols.forEach(h=>{const m=parseInt(h.date.split('-')[1]);if(!grouped[m])grouped[m]=[];grouped[m].push(h);});

  return h('div',{className:'space-y'},
    h('div',{className:'flex items-center justify-between'},
      h('div',{className:'flex items-center gap-2'},
        h('span',{style:{color:'#fff',fontWeight:700,fontSize:16}},'2026 Holiday Calendar'),
        h('span',{style:{background:'rgba(133,77,14,0.2)',border:'1px solid rgba(202,138,4,0.4)',color:'#facc15',fontSize:11,padding:'2px 8px',borderRadius:999}},holidays.length+' holidays')),
      h('button',{className:'btn btn-yellow btn-sm',onClick:()=>{setShowForm(!showForm);setEditingId(null);setForm({date:'',name:'',isIslamic:false});setError('');}},
        Icons.plus(),' Add Holiday')),
    showForm && h('div',{className:'card-yellow'},
      h('div',{style:{color:'#fff',fontWeight:700,marginBottom:16}},editingId?'Edit Holiday':'Add New Holiday'),
      h('form',{onSubmit:handleSubmit},
        h('div',{className:'grid-2',style:{gap:12,marginBottom:12}},
          h('div',{className:'input-group'},
            h('label',{className:'label'},'Date *'),
            h('input',{type:'date',className:'input',value:form.date,onChange:e=>setForm(p=>({...p,date:e.target.value}))})),
          h('div',{className:'input-group'},
            h('label',{className:'label'},'Holiday Name *'),
            h('input',{type:'text',className:'input',value:form.name,onChange:e=>setForm(p=>({...p,name:e.target.value})),placeholder:'e.g., Eid-ul-Fitr'}))),
        h('label',{style:{display:'flex',alignItems:'center',gap:12,cursor:'pointer',marginBottom:12}},
          h('input',{type:'checkbox',checked:form.isIslamic,onChange:e=>setForm(p=>({...p,isIslamic:e.target.checked})),style:{width:16,height:16,accentColor:'#eab308'}}),
          h('div',null,
            h('div',{style:{color:'#fff',fontSize:13}},'Islamic Holiday'),
            h('div',{style:{color:'#6b7280',fontSize:12}},'Subject to moon sighting — date may be adjusted'))),
        error && h('div',{className:'alert alert-red',style:{marginBottom:12}},error),
        h('div',{className:'flex gap-3'},
          h('button',{type:'submit',className:'btn btn-yellow flex-1',style:{justifyContent:'center'}},editingId?'Update Holiday':'Add Holiday'),
          h('button',{type:'button',className:'btn btn-ghost',onClick:()=>{setShowForm(false);setEditingId(null);}}, 'Cancel')))),
    h('div',{className:'grid-2'},
      Object.entries(grouped).map(([monthNum,hols])=>
        h('div',{key:monthNum,className:'card'},
          h('div',{style:{color:'#facc15',fontWeight:700,fontSize:13,marginBottom:12,display:'flex',alignItems:'center',gap:8}},
            Icons.calcheck(),MONTHS[parseInt(monthNum)-1]),
          h('div',{className:'space-y-sm'},
            hols.map(hol=>{
              const d=new Date(hol.date+'T12:00:00');
              return h('div',{key:hol.id,style:{display:'flex',alignItems:'center',gap:12,background:'#1f2937',borderRadius:8,padding:'8px 12px'}},
                h('div',{style:{width:40,height:40,background:'#374151',borderRadius:8,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',flexShrink:0}},
                  h('span',{style:{color:'#fff',fontWeight:700,fontSize:13,lineHeight:1}},d.getDate()),
                  h('span',{style:{color:'#9ca3af',fontSize:10}},d.toLocaleDateString('en-IN',{weekday:'short'}))),
                h('div',{style:{flex:1,minWidth:0}},
                  h('div',{style:{color:'#fff',fontSize:13,fontWeight:500,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},hol.name),
                  h('div',{style:{display:'flex',alignItems:'center',gap:4,marginTop:2}},
                    hol.isIslamic ?

        store.setOfficeLocation(pos.coords.latitude, pos.coords.longitude, 50);
        setOfficeLoc(store.getOfficeLocation());
        setLocSaving(false);
        setLocMsg('success:Office location saved! Lat: '+pos.coords.latitude.toFixed(6)+', Lng: '+pos.coords.longitude.toFixed(6)+' — Radius: 50m');

        if(d.success){
          setUser(d.user);
          const t=getTheme(d.user.id); setCurrentTheme(t); applyTheme(t);
          api.getNotifications().then(nd=>{ if(nd.success) setNotifications(nd.notifications); }).catch(()=>{});
        } else {
          api.clearToken();
        }
      }).catch(()=>{ api.clearToken(); });
    }
  },[]);

  const refresh = useCallback(()=>forceUpdate(n=>n+1),[]);

  // Apply theme whenever it changes
  useEffect(()=>{ applyTheme(currentTheme); },[currentTheme]);

  // Load user theme on mount
  useEffect(()=>{
    if(user){ const t=getTheme(user.id); setCurrentTheme(t); applyTheme(t); }
  },[user]);

  useEffect(()=>{
    if(user) {
      api.getNotifications().then(d=>{ if(d.success) setNotifications(d.notifications); }).catch(()=>{});
    }
  },[user, activePage]);

  useEffect(()=>{
    if(!user) return;
    const hour=new Date().getHours();
    if(hour>=10){
      const today=new Date().toISOString().split('T')[0];
      api.getTodayAtt().then(d=>{
        if(d.success && !d.record && store.isWorkingDay(today)){
          const alreadyNotified = notifications.find(n=>n.type==='attendance-reminder'&&(n.createdAt||'').startsWith(today));
          if(!alreadyNotified){
            store.addNotification({userId:user.id,type:'attendance-reminder',message:'Reminder: You have not marked your attendance for today.',isRead:false,createdAt:new Date().toISOString()});
          }
        }
      }).catch(()=>{});
    }
  },[user]);

  const handleLogin = loggedInUser => {
    setUser(loggedInUser); setActivePage('dashboard');
    api.getNotifications().then(d=>{ if(d.success) setNotifications(d.notifications); }).catch(()=>{});
    const t=getTheme(loggedInUser.id); setCurrentTheme(t); applyTheme(t);
  };
  const handleLogout = () => { api.clearToken(); store.logout(); setUser(null); setActivePage('dashboard'); applyTheme(PRESET_THEMES[0]); };
  const handleMarkAllRead = () => { if(user){ api.markAllRead().catch(()=>{}); store.markAllRead(user.id); api.getNotifications().then(d=>{ if(d.success) setNotifications(d.notifications); }).catch(()=>{}); } };
  const handleUpdate = () => { refresh(); if(user) api.getNotifications().then(d=>{ if(d.success) setNotifications(d.notifications); }).catch(()=>{}); };
  const navigate = page => { setActivePage(page); setSidebarOpen(false); };
  const handleThemeChange = (theme) => { setCurrentTheme(theme); applyTheme(theme); if(user) saveTheme(user.id, theme); };

  if(!user) return h(LoginPage,{onLogin:handleLogin});

  const unread = notifications.filter(n=>!n.isRead).length;
  const filteredNav = NAV_ITEMS.filter(n=>n.roles.includes(user.role));
  const activeLabel = filteredNav.find(n=>n.id===activePage)?.label||'Dashboard';

  const renderPage = () => {
    switch(activePage){
      case 'dashboard': return h(Dashboard,{user,onNavigate:navigate});
      case 'attendance': return (user.role==='admin'||user.role==='hod') ? h(AdminHodAttendancePage,{user}) : h(AttendancePage,{user});
      case 'leaves': return h(LeavePage,{user,onUpdate:handleUpdate});
      case 'approvals': return user.role==='employee'?h(Dashboard,{user,onNavigate:navigate}):h(ApprovalsPage,{user,onUpdate:handleUpdate});
      case 'reports': return h(ReportsPage,{user});
      case 'users': return user.role!=='admin'?h(Dashboard,{user,onNavigate:navigate}):h(UserManagementPage,{currentUser:user});
      case 'holidays': return user.role!=='admin'?h(Dashboard,{user,onNavigate:navigate}):h(HolidayPage);
      case 'settings': return user.role==='admin'?h(SettingsPage,{currentTheme,onThemeChange:handleThemeChange,user}):h(ThemePage,{currentTheme,onThemeChange:handleThemeChange});
      default: return h(Dashboard,{user,onNavigate:navigate});
    }
  };

  return h('div',{className:'app'},
    // Desktop sidebar
    h('aside',{className:'sidebar'},h(SidebarContent,{user,activePage,onNavigate:navigate,onLogout:handleLogout})),
    // Mobile sidebar
    h('div',{className:'mobile-overlay'+(sidebarOpen?'':' hidden')},
      h('div',{className:'mobile-backdrop',onClick:()=>setSidebarOpen(false)}),
      h('aside',{className:'mobile-sidebar'},
        h('button',{onClick:()=>setSidebarOpen(false),style:{position:'absolute',top:12,right:12,background:'none',border:'none',color:'#9ca3af',cursor:'pointer'}},Icons.x()),
        h(SidebarContent,{user,activePage,onNavigate:navigate,onLogout:handleLogout}))),
    // Main
    h('div',{className:'main-content'},
      // Topbar
      h('header',{className:'topbar'},
        h('div',{className:'flex items-center gap-3'},
          h('button',{className:'btn-icon',style:{display:'flex'},onClick:()=>setSidebarOpen(true),id:'menu-btn'},Icons.menu()),
          h('div',null,
            h('div',{style:{color:'var(--text)',fontWeight:700,fontSize:15}},activeLabel),
            h('div',{style:{color:'var(--text3)',fontSize:12}},new Date().toLocaleDateString('en-IN',{weekday:'long',year:'numeric',month:'long',day:'numeric'})))),
        h('div',{className:'flex items-center gap-2'},

          // Notifications
          h('div',{style:{position:'relative'}},
            h('button',{className:'btn-icon',style:{position:'relative'},onClick:()=>setNotifOpen(!notifOpen)},
              Icons.bell(),
              unread>0 && h('span',{style:{position:'absolute',top:-2,right:-2,width:16,height:16,background:'#dc2626',color:'#fff',fontSize:10,borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700}},unread>9?'9+':unread)),
            notifOpen && h('div',{className:'notif-panel'},
              h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'12px 16px',borderBottom:'1px solid #1f2937'}},
                h('span',{style:{color:'#fff',fontWeight:600,fontSize:13}},'Notifications'),
                unread>0&&h('button',{onClick:()=>{handleMarkAllRead();setNotifOpen(false);},style:{color:'#eab308',fontSize:12,background:'none',border:'none',cursor:'pointer'}},'Mark all read')),
              h('div',{style:{maxHeight:280,overflowY:'auto'}},
                notifications.length===0 ?
                  h('div',{style:{color:'#6b7280',fontSize:13,textAlign:'center',padding:'24px 16px'}},'No notifications')
                :
                  notifications.slice(0,10).map(n=>
                    h('div',{key:n.id,style:{padding:'12px 16px',borderBottom:'1px solid #1f2937',background:n.isRead?'transparent':'rgba(133,77,14,0.07)'}},
                      h('div',{style:{color:'#d1d5db',fontSize:12}},n.message),
                      h('div',{style:{color:'#4b5563',fontSize:11,marginTop:2}},new Date(n.createdAt).toLocaleDateString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}))))))),
          h('div',{className:'avatar avatar-yellow'},user.name.charAt(0)))),
      // Page
      h('main',{className:'page-area'},renderPage()),
      // Mobile bottom nav
      h('nav',{className:'bottom-nav'},
        h('div',{className:'bottom-nav-items'},
          filteredNav.slice(0,5).map(item=>
            h('button',{key:item.id,className:'bottom-nav-item'+(activePage===item.id?' active':''),onClick:()=>navigate(item.id)},
              item.icon(),
              h('span',{className:'bottom-nav-label'},item.label.split(' ')[0])))))),
    // Notif backdrop
    notifOpen && h('div',{style:{position:'fixed',inset:0,zIndex:40},onClick:()=>setNotifOpen(false)}));
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));

// Hide menu button on desktop
const style = document.createElement('style');
style.textContent = '@media(min-width:1024px){#menu-btn{display:none!important}}';
document.head.appendChild(style);
</script>
</body>
</html>
